name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -race -count=1
      - name: Build without cgo
        env:
          CGO_ENABLED: "0"
        run: go build ./...
      - name: Cross-compile for unsupported and 32-bit targets
        if: matrix.os == 'ubuntu-latest'
        run: |
          GOOS=freebsd GOARCH=amd64 go build ./... && GOOS=freebsd GOARCH=amd64 go vet ./...
          GOOS=windows GOARCH=386 go build ./... && GOOS=windows GOARCH=386 go vet ./...

  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Runner CPU
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) lscpu | grep -E '^ *(Model name|CPU\(s\)):' || true ;;
            macOS) sysctl -n machdep.cpu.brand_string hw.ncpu || true ;;
            Windows) powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name; [Environment]::ProcessorCount" || true ;;
          esac
      - name: Throughput smoke
        run: go run ./cmd/ipcbench -mode throughput -conns 2 -size 64KiB -duration 1s
      - name: Latency smoke
        run: go run ./cmd/ipcbench -mode latency -duration 1s
