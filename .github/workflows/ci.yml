name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -race -count=1
      - name: Build without cgo
        env:
          CGO_ENABLED: "0"
        run: go build ./...
      - name: Cross-compile for unsupported and 32-bit targets
        if: matrix.os == 'ubuntu-latest'
        run: |
          GOOS=freebsd GOARCH=amd64 go build ./... && GOOS=freebsd GOARCH=amd64 go vet ./...
          GOOS=windows GOARCH=386 go build ./... && GOOS=windows GOARCH=386 go vet ./...

  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Runner CPU
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) lscpu | grep -E '^ *(Model name|CPU\(s\)):' || true ;;
            macOS) sysctl -n machdep.cpu.brand_string hw.ncpu || true ;;
            Windows) powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name; [Environment]::ProcessorCount" || true ;;
          esac | tee -a "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
      - name: Compare
        shell: bash
        run: go run ./cmd/ipcbench -mode compare -duration 1s | tee -a "$GITHUB_STEP_SUMMARY"
      - name: A/B against base
        shell: bash
        env:
          # The PR's base commit, or the commit master pointed at before the push.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          bash hack/ab-bench.sh "$BASE" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
